<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2400" height="1350" viewBox="0 0 2400 1350" role="img" aria-labelledby="title desc">
  <title id="title">一首歌，怎样长成一栋楼？</title>
  <desc id="desc">五步图解：放入一首歌，听出音乐性格，做建筑选择，让空间、交通、结构和外墙一起生成，再经过检查得到可追溯的建筑。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071522"/>
      <stop offset="0.55" stop-color="#0b2740"/>
      <stop offset="1" stop-color="#06111c"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6fe6ff"/>
      <stop offset="1" stop-color="#2da8e8"/>
    </linearGradient>
    <linearGradient id="imageShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.52" stop-color="#071522" stop-opacity="0"/>
      <stop offset="1" stop-color="#071522" stop-opacity="0.92"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8ddfff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clipSection"><rect x="1282" y="344" width="382" height="204" rx="18"/></clipPath>
    <clipPath id="clipStructure"><rect x="1282" y="578" width="382" height="204" rx="18"/></clipPath>
    <clipPath id="clipFacade"><rect x="1282" y="812" width="382" height="204" rx="18"/></clipPath>
    <clipPath id="clipHero"><rect x="1746" y="344" width="570" height="610" rx="24"/></clipPath>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans SC", "Segoe UI", sans-serif; }
      .card { fill:#0d2942; fill-opacity:.82; stroke:#8cdfff; stroke-opacity:.24; stroke-width:2; }
      .stage { fill:#9cecff; font-size:23px; font-weight:700; letter-spacing:1px; }
      .stageTitle { fill:#ffffff; font-size:34px; font-weight:800; }
      .small { fill:#c9dbe7; font-size:23px; }
      .tiny { fill:#a9c4d4; font-size:19px; }
      .chip { fill:#143a58; stroke:#7bddf5; stroke-opacity:.36; stroke-width:1.5; }
      .chipText { fill:#eefaff; font-size:23px; font-weight:700; }
      .whiteLine { stroke:#d7f7ff; stroke-opacity:.68; fill:none; }
    </style>
  </defs>

  <rect width="2400" height="1350" fill="url(#bg)"/>
  <rect width="2400" height="1350" fill="url(#grid)"/>
  <circle cx="2160" cy="160" r="360" fill="#1c6f98" opacity="0.11"/>
  <circle cx="80" cy="1260" r="420" fill="#1c6f98" opacity="0.08"/>

  <text x="82" y="132" fill="#ffffff" font-size="72" font-weight="900">一首歌，怎样长成一栋楼？</text>
  <path d="M84 172H2316" stroke="url(#cyanGlow)" stroke-width="5" stroke-linecap="round" opacity="0.9"/>

  <!-- Stage cards -->
  <rect class="card" x="50" y="228" width="320" height="930" rx="26" filter="url(#shadow)"/>
  <rect class="card" x="406" y="228" width="360" height="930" rx="26" filter="url(#shadow)"/>
  <rect class="card" x="802" y="228" width="420" height="930" rx="26" filter="url(#shadow)"/>
  <rect class="card" x="1258" y="228" width="430" height="930" rx="26" filter="url(#shadow)"/>
  <rect class="card" x="1724" y="228" width="640" height="930" rx="26" filter="url(#shadow)"/>

  <!-- Connectors -->
  <g stroke="#7ce5ff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M375 694H395m-10-10 10 10-10 10"/>
    <path d="M771 694H791m-10-10 10 10-10 10"/>
    <path d="M1227 694H1247m-10-10 10 10-10 10"/>
    <path d="M1693 694H1713m-10-10 10 10-10 10"/>
  </g>


name: Model quality

on:
  push:
    branches: [codex/march-print-readiness]

permissions:
  contents: read

jobs:
  fabrication-test-dependency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download optional geometry wheel for offline review tests
        run: |
          python -m pip download --only-binary=:all: --no-deps 'manifold3d>=3,<4' -d wheels
      - uses: actions/upload-artifact@v4
        with:
          name: fabrication-test-wheels
          path: wheels/*
          retention-days: 1
          if-no-files-found: error

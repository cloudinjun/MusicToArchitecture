name: Model quality

on:
  push:
    branches: [codex/march-print-readiness]
  pull_request:
    paths:
      - 'backend/**'
      - 'blender/**'
      - '.github/workflows/model-quality.yml'

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive exact source for reproducible review
        run: |
          git rev-parse HEAD > revision.txt
          git archive --format=tar.gz -o source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: model-quality-source
          path: |
            source.tar.gz
            revision.txt
          retention-days: 1
          if-no-files-found: error

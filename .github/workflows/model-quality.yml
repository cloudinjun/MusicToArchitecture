name: Model quality

on:
  push:
    branches: [codex/march-print-readiness]
  pull_request:
    paths:
      - 'backend/**'
      - 'blender/**'
      - 'fixtures/fabrication/**'
      - '.github/workflows/model-quality.yml'

permissions:
  contents: read

jobs:
  model-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install portable and optional fabrication dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-fabrication.txt
      - name: Geometry, furniture and actual STL round-trip tests
        run: |
          mkdir -p test-results
          python -m pytest -q backend/tests/test_fabrication.py backend/tests/test_furniture_assemblies.py backend/tests/test_geometry_review.py --junitxml=test-results/geometry.xml
      - name: Existing dependency regression (offset-roof scenarios excluded)
        run: python -m pytest -q backend/tests/test_dependencies.py -k 'not offset_roofs' --junitxml=test-results/dependencies.xml
      - name: Existing single-fixture compiler regressions
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          import pytest
          path = Path('backend/tests/test_compiler_v3.py')
          selected = [f'{path}::{node.name}' for node in ast.parse(path.read_text()).body
                      if isinstance(node, ast.FunctionDef) and node.name.startswith('test_')
                      and {arg.arg for arg in node.args.args} <= {'model'}]
          if not selected:
              raise SystemExit('No compiler regressions selected')
          print(f'Running {len(selected)} single-fixture compiler checks; not the full suite')
          raise SystemExit(pytest.main(['-q', '--junitxml=test-results/compiler.xml', *selected]))
          PY
      - name: Verify committed diagnostic coupon identity
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          folder = Path('artifacts/evidence/march_print_readiness')
          evidence = json.loads((folder / 'verification.json').read_text())
          assert hashlib.sha256((folder / 'desk-coupon.stl').read_bytes()).hexdigest() == evidence['coupon']['sha256']
          assert evidence['verification']['furniture_coupon']['slicer_verified'] == 'not_checked'
          print('Diagnostic coupon identity verified; no slicing/physical claim')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-quality-tests
          path: test-results/*.xml
          retention-days: 14
          if-no-files-found: warn

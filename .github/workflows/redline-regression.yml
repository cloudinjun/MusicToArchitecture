name: Redline targeted regression
on:
  pull_request:
    paths:
      - backend/**
      - .github/workflows/redline-regression.yml
  push:
    branches: [main]
    paths:
      - backend/**
      - .github/workflows/redline-regression.yml
permissions:
  contents: read
jobs:
  regression:
    name: Targeted geometry, drawing and pipeline tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Run targeted regressions (not the full repository suite)
        run: |
          python -m pytest -q \
            backend/tests/test_redline_r1.py \
            backend/tests/test_drawings.py \
            backend/tests/test_geometry_review.py \
            backend/tests/test_plate_ring_validity.py \
            backend/tests/test_preview_failure_isolation.py \
            --junitxml=redline-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redline-test-results
          path: redline-junit.xml
          retention-days: 14

    scores:
      hierarchy: 0.90
      repetition: 0.40
      variation: 0.85
      density: 0.72
      continuity: 0.35
      interruption: 0.95
      polyphony: 0.90
      tension_release: 0.98
      tempo_of_change: 0.85
    entry_mapping: >-

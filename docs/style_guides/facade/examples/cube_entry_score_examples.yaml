  - id: entry-06-postmodern
    grammar_id: postmodernism_informed
    scores:
      hierarchy: 0.95
      repetition: 0.55
      variation: 0.70
      density: 0.60
      continuity: 0.50
      interruption: 0.80
      polyphony: 0.85
      tension_release: 0.75
      tempo_of_change: 0.58
    entry_mapping: >-
      An oversized flattened portal/frame communicates civic entry over a regular
